<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">Luca network capture and analysis architecture</title>
<desc id="desc">A Wi-Fi device connects to a monitored access point. TShark saves a packet capture. Zeek and Suricata analyze traffic with indicators and heuristics, producing classified alerts and a report.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#0e2630"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#34c9bd"/><stop offset="1" stop-color="#80e7c2"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#294454" stroke-width="0.7" opacity=".38"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
  <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#55d8ca"/></marker>
</defs>
<rect width="1280" height="560" fill="url(#bg)"/>
<rect width="1280" height="560" fill="url(#grid)" opacity=".75"/>
<rect x="40" y="33" width="7" height="48" rx="3" fill="url(#accent)"/>
<text x="63" y="56" fill="#e8f9f5" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" letter-spacing="5">LUCA</text>
<text x="63" y="79" fill="#95b6c0" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2">NETWORK TRAFFIC ANALYSIS</text>
<text x="1240" y="58" fill="#82a6b1" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="end">CAPTURE  /  INSPECT  /  REPORT</text>
<path d="M42 105H1238" stroke="#345262" opacity=".75"/>

<!-- Main analysis path -->
<g stroke="#55d8ca" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
 <path d="M263 288H303"/>
 <path d="M494 288H534"/>
 <path d="M723 288H763"/>
 <path d="M992 288H1032"/>
</g>
