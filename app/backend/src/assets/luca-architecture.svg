<circle cx="243" cy="475" r="5" fill="#63e3c8"/>
<text x="262" y="471" fill="#eaf7f4" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="15">Detection context</text>
<text x="262" y="491" fill="#9dbec8" font-family="Arial,Helvetica,sans-serif" font-size="12">IoC feeds  •  MISP  •  allowlists  •  configurable heuristics  •  Suricata signatures</text>
<text x="1238" y="539" text-anchor="end" fill="#658d98" font-family="Arial,Helvetica,sans-serif" font-size="11">SYSTEM ARCHITECTURE  /  NOT TO SCALE</text>
